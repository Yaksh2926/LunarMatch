[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarmatch"
version = "0.1.0"
description = "Multi-modal lunar image correspondence and registration"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary until team selects a license"}
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "opencv-python>=4.8",
  "scikit-image>=0.22", "pydantic>=2.5", "PyYAML>=6.0",
  "typer>=0.12", "rich>=13.7", "tifffile>=2024.2"
]

[project.optional-dependencies]
geo = ["rasterio>=1.3", "shapely>=2.0", "pyproj>=3.6"]
report = ["jinja2>=3.1", "matplotlib>=3.8"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10"]
learned = ["torch>=2.2"]

[project.scripts]
lunarmatch = "lunarmatch.cli.app:app"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "real_model: Opt-in real model test marker requiring model weights",
]
[tool.ruff]
line-length = 100
target-version = "py311"
[tool.mypy]
python_version = "3.12"
strict = true
