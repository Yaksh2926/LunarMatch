run:
  seed: 42
  output_dir: outputs/ohrc_to_iirs
  overwrite: true
io:
  source_band: 1
  reference_band: 1
  max_megapixels_in_memory: 256
  nodata_policy: metadata_or_nan
preprocess:
  representation: gradient
  percentile_clip: [1.0, 99.0]
  clahe_clip_limit: 2.0
  denoise_sigma: 0.8
pyramid:
  scale_aware_matching: true
  metadata_scale_prior: true
  metadata_scale_uncertainty_octaves: 1.5
  log2_scale_min: -2
  log2_scale_max: 9
  levels_per_octave: 2
features:
  backend: sift
  max_keypoints: 30000
  tile_size: 2048
matching:
  ratio_threshold: 0.85
  mutual: true
geometry:
  model: affine
  robust_method: usac_magsac
  reprojection_threshold_px: 4.0
  allowed_scale: [0.001, 500.0]
  allow_reflection: false
coverage:
  grid_rows: 8
  grid_cols: 8
  min_occupied_fraction: 0.20
subpixel:
  method: ecc_patch
  patch_radius: 15
quality_gates:
  min_inliers: 15
  min_inlier_ratio: 0.10
